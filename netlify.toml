# Sitio estático, sin build.
[build]
  publish = "."
  command = ""

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Las obras y la animación no cambian: que las cachee fuerte.
[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# El HTML y la config sí cambian: siempre frescos.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/allowlist.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# magaiba.xyz — el dominio se apunta desde el panel de Netlify.
# www va al apex.
[[redirects]]
  from = "https://www.magaiba.xyz/*"
  to = "https://magaiba.xyz/:splat"
  status = 301
  force = true

# El sitio vive en /raremagaiba/. Es un rewrite (200), no un redirect: la
# URL que ve el visitante no cambia, y las rutas relativas del HTML siguen
# resolviendo porque termina en barra.
[[redirects]]
  from = "/raremagaiba"
  to = "/raremagaiba/"
  status = 301

[[redirects]]
  from = "/raremagaiba/*"
  to = "/:splat"
  status = 200

# El plural, por si alguien lo escribe así.
[[redirects]]
  from = "/raremagaibas/*"
  to = "/raremagaiba/:splat"
  status = 301
